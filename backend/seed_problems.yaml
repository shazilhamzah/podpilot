apiVersion: v1
kind: Namespace
metadata:
  name: podpilot-demo
  labels:
    app: podpilot-demo

---
# PROBLEM 1 - CRASH LOOPING POD
apiVersion: v1
kind: Pod
metadata:
  name: crash-loop-pod
  namespace: podpilot-demo
spec:
  containers:
  - name: failing-container
    image: nginx:this-image-does-not-exist
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

---
# PROBLEM 2 - DEPLOYMENT WITH NO RESOURCE LIMITS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-limits-deployment
  namespace: podpilot-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: no-limits
  template:
    metadata:
      labels:
        app: no-limits
    spec:
      containers:
      - name: nginx
        image: nginx:1.25

---
# PROBLEM 3 - OVERSIZED DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oversized-deployment
  namespace: podpilot-demo
spec:
  replicas: 5
  selector:
    matchLabels:
      app: oversized
  template:
    metadata:
      labels:
        app: oversized
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi

---
# PROBLEM 4 - UNATTACHED PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orphan-pvc
  namespace: podpilot-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi

---
# PROBLEM 5 - NODEPORT SERVICE
apiVersion: v1
kind: Service
metadata:
  name: exposed-nodeport-service
  namespace: podpilot-demo
spec:
  type: NodePort
  selector:
    # Targets the no-limits-deployment
    app: no-limits
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32001

---
# PROBLEM 6 - UNPINNED IMAGE TAG
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpinned-image-deployment
  namespace: podpilot-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unpinned
  template:
    metadata:
      labels:
        app: unpinned
    spec:
      containers:
      - name: redis
        image: redis:latest
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

# VERIFICATION COMMANDS:
# kubectl apply -f seed_problems.yaml
# kubectl get all -n podpilot-demo
# kubectl get pvc -n podpilot-demo
# kubectl describe pod crash-loop-pod -n podpilot-demo
# kubectl top pods -n podpilot-demo
