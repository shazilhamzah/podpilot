apiVersion: v1
kind: Namespace
metadata:
  name: podpilot-demo
  labels:
    app: podpilot-demo

---
# PROBLEM 1 - CRASH LOOPING POD (1 pod)
apiVersion: v1
kind: Pod
metadata:
  name: crash-loop-pod
  namespace: podpilot-demo
spec:
  containers:
  - name: failing-container
    image: nginx:this-image-does-not-exist
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

---
# PROBLEM 2 - OVERSIZED DEPLOYMENT (1 pod)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oversized-deployment
  namespace: podpilot-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oversized
  template:
    metadata:
      labels:
        app: oversized
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi

---
# PROBLEM 3 - DEPLOYMENT WITH NO RESOURCE LIMITS (1 pod)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-limits-deployment
  namespace: podpilot-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: no-limits
  template:
    metadata:
      labels:
        app: no-limits
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        # Notice there is no 'resources' block here, triggering a warning in PodPilot!
