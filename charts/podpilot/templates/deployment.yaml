apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "podpilot.fullname" . }}
  labels:
    app.kubernetes.io/name: podpilot
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podpilot
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podpilot
        app.kubernetes.io/instance: {{ .Release.Name }}
        azure.workload.identity/use: "true"
    spec:
      {{- if .Values.imageCredentials }}
      imagePullSecrets:
        - name: {{ include "podpilot.fullname" . }}-registry
      {{- end }}
      serviceAccountName: {{ include "podpilot.fullname" . }}
      containers:
        - name: podpilot
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: {{ include "podpilot.fullname" . }}-secrets
          env:
            - name: SERVE_FRONTEND
              value: "true"
            {{- if .Values.opencost.enabled }}
            - name: OPENCOST_ENDPOINT
              value: "http://{{ .Release.Name }}-opencost.{{ .Release.Namespace }}.svc.cluster.local:9003/allocation/compute"
            {{- end }}
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "podpilot.fullname" . }}-secrets
                  key: AI_API_KEY
            - name: AZURE_SUBSCRIPTION_ID
              value: {{ .Values.workloadIdentity.subscriptionId | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 30
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 30
