apiVersion: v1
kind: Secret
metadata:
  name: {{ include "podpilot.fullname" . }}-secrets
  labels:
    app.kubernetes.io/name: podpilot
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  AZURE_OPENAI_ENDPOINT: {{ .Values.aiFoundry.endpoint | quote }}
  AZURE_OPENAI_DEPLOYMENT: {{ .Values.aiFoundry.deployment | quote }}
  AI_API_KEY: {{ .Values.aiFoundry.apiKey | quote }}
  MONGO_DB_URI: {{ .Values.database.uri | quote }}
  CLUSTER_NAME: {{ .Values.clusterName | quote }}
  MONGO_DB_NAME: {{ default .Values.clusterName .Values.database.dbName | quote }}
