# PodPilot Helm Chart Values

# ---------------------------------------------------------
# 1. CORE CREDENTIALS (Required)
# ---------------------------------------------------------
clusterName: "my-cluster"

workloadIdentity:
  clientId: "<CLIENT_ID_PROVIDED_BY_PODPILOT_TEAM>"
  tenantId: "<TENANT_ID_PROVIDED_BY_PODPILOT_TEAM>"
  subscriptionId: "<AZURE_SUBSCRIPTION_ID>"

database:
  uri: "<MONGO_DB_URI_PROVIDED_BY_PODPILOT_TEAM>"
  dbName: "" # Defaults to clusterName if left empty

basicAuth:
  enabled: true
  htpasswd: |-
    <HTPASSWD_PROVIDED_BY_PODPILOT_TEAM>

# ---------------------------------------------------------
# 2. INTERNAL BACKEND CONFIGURATION
# ---------------------------------------------------------
aiFoundry:
  endpoint: "<ENDPOINT_PROVIDED_BY_PODPILOT_TEAM>"
  deployment: "gpt-4o"
  # Authentication is handled securely via Azure Workload Identity.
  # No API key is required here.
  apiKey: ""

imageCredentials: ""

# ---------------------------------------------------------
# 3. ADVANCED CUSTOMIZATIONS (Optional)
# ---------------------------------------------------------
nameOverride: ""
fullnameOverride: ""
containerName: ""

image:
  repository: podpilotregistry.azurecr.io/podpilot
  digest: ""
  tag: "v0.1.2"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

service:
  type: LoadBalancer
  port: 80

ingress:
  enabled: false
  className: "nginx"
  host: ""
  tls:
    enabled: false
    clusterIssuer: "letsencrypt-prod"
    secretName: "podpilot-tls"

serviceAccount:
  create: true
  name: "podpilot" # Hardcoded default for predictable identity federation

opencost:
  enabled: true # If false, podpilot falls back to CPU/RAM utilization estimates
  opencost:
    ui:
      enabled: false
