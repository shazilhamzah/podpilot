apiVersion: apps/v1
kind: Deployment
metadata:
  name: high-cpu-processor
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: high-cpu-processor
  template:
    metadata:
      labels:
        app: high-cpu-processor
    spec:
      containers:
      - name: cpu-worker
        image: alpine
        # This command runs an infinite loop in the background and a dd command, consuming CPU.
        # It also creates a 50MB file in memory to consume some RAM.
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Starting heavy CPU and Memory workload..."
          cat /dev/urandom | head -c 50M > /tmp/dummy_data.bin
          while true; do
            dd if=/dev/zero of=/dev/null count=1000000 2>/dev/null
          done
        resources:
          requests:
            cpu: "300m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog-cache
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-hog-cache
  template:
    metadata:
      labels:
        app: memory-hog-cache
    spec:
      containers:
      - name: mem-worker
        image: alpine
        # This command allocates a large file in /tmp (which is memory-backed tmpfs in alpine usually, 
        # or just takes up filesystem cache memory) and sleeps. 
        # We can also use tail /dev/zero to consume memory fast, but let's be safe and use head.
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Allocating 200MB of memory..."
          head -c 200M /dev/urandom | grep "something" || sleep infinity
        resources:
          requests:
            cpu: "50m"
            memory: "256Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"
