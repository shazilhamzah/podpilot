---
apiVersion: v1
kind: Namespace
metadata:
  name: validation-env
---
# 3. Configuration & Secrets Management
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: validation-env
data:
  APP_ENV: "validation"
  LOG_LEVEL: "debug"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: validation-env
type: Opaque
stringData:
  DB_USER: "admin"
  DB_PASS: "supersecret"
---
# 4. Storage & Persistence
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data-pvc
  namespace: validation-env
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 1. Workload Resources (Compute) - Deployments
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: validation-env
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
# 1. Workload Resources (Compute) - StatefulSets
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database-statefulset
  namespace: validation-env
spec:
  serviceName: "db-svc"
  replicas: 2
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: db-credentials
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASS
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# 1. Workload Resources (Compute) - DaemonSets
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-forwarder-daemonset
  namespace: validation-env
spec:
  selector:
    matchLabels:
      app: log-forwarder
  template:
    metadata:
      labels:
        app: log-forwarder
    spec:
      containers:
        - name: fluentd
          image: fluent/fluentd:v1.16-1
          resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 200Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
---
# 1. Workload Resources (Compute) - Jobs
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration-job
  namespace: validation-env
spec:
  backoffLimit: 2
  template:
    spec:
      containers:
        - name: migration
          image: busybox
          command: ["sh", "-c", "echo 'Running database migrations...' && sleep 5 && echo 'Done'"]
      restartPolicy: Never
---
# 1. Workload Resources (Compute) - CronJobs
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-backup-cronjob
  namespace: validation-env
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: busybox
              command: ["sh", "-c", "echo 'Running nightly backup...' && sleep 10"]
          restartPolicy: OnFailure
---
# 2. Network & Connectivity - ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: db-svc
  namespace: validation-env
spec:
  selector:
    app: database
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  clusterIP: None # Headless service for StatefulSet
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: validation-env
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
# 2. Network & Connectivity - NodePort Service
apiVersion: v1
kind: Service
metadata:
  name: debug-ui-svc
  namespace: validation-env
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
---
# 2. Network & Connectivity - LoadBalancer Service
apiVersion: v1
kind: Service
metadata:
  name: public-api-svc
  namespace: validation-env
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
# 2. Network & Connectivity - Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-app-ingress
  namespace: validation-env
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: validation.myapp.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: public-api-svc
                port:
                  number: 80
---
# 2. Network & Connectivity - NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-db-access-except-backend
  namespace: validation-env
spec:
  podSelector:
    matchLabels:
      app: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5432
---
# 5. Scaling & Resource Management - HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: validation-env
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: validation-env
  labels:
    app: nginx
spec:
  containers:
  - name: nginx
    image: nginx:latest
    ports:
    - containerPort: 80
